<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <meta name="description" content="J A B I R — Digital Creator. Chasing light, intentional frames, and timeless portraits.">
  <title>J A B I R | Digital Creator</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg, #101010); color: #f1eee8; font-family: Arial, Helvetica, sans-serif; -webkit-font-smoothing: antialiased; }
    main { width: min(100% - 40px, 760px); margin: 0 auto; text-align: center; padding: 72px 0 52px; }
    h1 { margin: 0; font-size: clamp(2.5rem, 9vw, 5rem); font-weight: 400; letter-spacing: .22em; padding-left: .22em; }
    .role { margin: 16px 0 44px; color: #bcb6ac; font-size: .78rem; text-transform: uppercase; letter-spacing: .35em; }
    .portrait { width: 100%; max-width: 560px; margin: auto; background: var(--image-bg, #242424); overflow: hidden; }
    .portrait img { display: block; width: 100%; height: auto; max-height: 660px; object-fit: cover; }
    .about { max-width: 490px; margin: 43px auto 0; color: #c7c1b8; line-height: 1.85; font-size: 1rem; }
    .contact { display: inline-block; margin-top: 30px; color: #eee6d9; text-decoration: none; border-bottom: 1px solid #7c766e; padding-bottom: 7px; font-size: .9rem; }
    .contact:hover, .contact:focus-visible { color: #fff; border-color: #fff; }
    footer { margin-top: 80px; color: #77716a; font-size: .75rem; letter-spacing: .1em; }
    @media (max-width: 480px) { main { padding-top: 55px; } .role { margin-bottom: 32px; } footer { margin-top: 64px; } }
  </style>
</head>
<body>
  <main>
    <h1>JABIR</h1>
    <p class="role">Digital Creator</p>
    <div class="portrait"><img src="portrait.jpg" alt="Portrait of Jabir" fetchpriority="high"></div>
    <p class="about">Chasing light, intentional frames, and timeless portraits.<br>Crafting mood-driven frames &amp; digital content.</p>
    <a class="contact" href="mailto:jabisaifu@gmail.com">jabisaifu@gmail.com</a>
    <footer>&copy; <span id="year">2026</span> J A B I R</footer>
  </main>
  <script>
    // Pick a different static luxury-dark palette on each page load.
    const themes = [
      { bg: '#101010', image: '#242424', browser: '#101010' }, // charcoal
      { bg: '#10251d', image: '#203b2e', browser: '#10251d' }, // forest green
      { bg: '#101e32', image: '#23334a', browser: '#101e32' }, // midnight blue
      { bg: '#30151c', image: '#46242c', browser: '#30151c' }, // burgundy
      { bg: '#23172e', image: '#382742', browser: '#23172e' }, // deep purple
      { bg: '#2a2018', image: '#403026', browser: '#2a2018' }  // espresso
    ];
    let previous = -1;
    try { previous = Number(localStorage.getItem('jabir-last-theme')); } catch (_) {}
    const choices = themes.map((_, i) => i).filter(i => i !== previous);
    const selected = choices[Math.floor(Math.random() * choices.length)];
    const theme = themes[selected];
    document.documentElement.style.setProperty('--bg', theme.bg);
    document.documentElement.style.setProperty('--image-bg', theme.image);
    document.querySelector('meta[name="theme-color"]').setAttribute('content', theme.browser);
    try { localStorage.setItem('jabir-last-theme', String(selected)); } catch (_) {}
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
